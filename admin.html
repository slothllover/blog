<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pannello Admin - Scrivi Post</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        body { font-family: sans-serif; max-width: 1200px; margin: 40px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; }
        input[type="file"] { display: block; margin-top: 5px; }
        button { background: #3ecf8e; color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 16px; border-radius: 5px; }
        button:hover { background: #34b279; }

        /* Toolbar */
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 6px;
        }
        #toolbar button {
            padding: 4px 10px;
            font-size: 14px;
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            min-width: 32px;
        }
        #toolbar button:hover {
            background: #ddd;
        }
        #toolbar .sep {
            width: 1px;
            background: #ccc;
            margin: 0 3px;
            align-self: stretch;
        }

        /* Placeholder per contenteditable */
        #content:empty:before {
            content: attr(placeholder);
            color: #aaa;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="login-box" style="max-width: 400px; margin: 100px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
        <h2>Accesso Amministratore</h2>
        <div class="form-group">
            <label>Email</label>
            <input type="text" id="login-email" placeholder="La tua email...">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="La tua password...">
        </div>
        <button id="login-btn">Accedi</button>
    </div>

    <div id="admin-panel" style="display: none;">
            <section class="hero">
        <div class="container">
            <div class="heading">
                <h1 class="title">Aggiungi un nuovo articolo</h1>
            </div>
            <div class="content">
                <p>
                Qui puoi caricare un post sul blog ufficiale. Controlla le credenziali inserite nel caso di errore di caricamento.
                </p>
            </div>
        </div>
    </section>

        <div class="form-group">
            <label for="title">Titolo</label>
            <input type="text" id="title" placeholder="Inserisci il titolo..." class="text-input contact-input">
        </div>

        <div class="form-group">
            <label for="category">Destinazione Post</label>
            <select id="category" style="width: 100%; padding: 8px; border-radius: 5px; font-family: inherit;">
                <option value="blog">Home Page (Blog)</option>
                <option value="books">Libri letti (Books)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="layout">Layout immagini</label>
            <select id="layout" style="width: 100%; padding: 8px; border-radius: 5px; font-family: inherit;">
                <option value="single">1 immagine (come adesso)</option>
                <option value="two-side">2 immagini affiancate (sinistra/destra)</option>
                <option value="two-stack">2 immagini impilate (sopra/sotto)</option>
                <option value="three-big-left">3: grande a sinistra + 2 piccole a destra</option>
                <option value="three-big-right">3: grande a destra + 2 piccole a sinistra</option>
                <option value="three-big-top">3: grande sopra + 2 piccole sotto</option>
                <option value="three-big-bottom">3: grande sotto + 2 piccole sopra</option>
                <option value="four-grid">4 immagini (griglia 2×2)</option>
            </select>
        </div>

        <div id="image-slots"></div>

        <div class="form-group">
            <label>Contenuto</label>

            <div id="toolbar">
                <button type="button" onclick="formato('bold')"><b>B</b></button>
                <button type="button" onclick="formato('italic')"><i>I</i></button>
                <button type="button" onclick="formato('underline')" style="text-decoration:underline">U</button>
                <div class="sep"></div>
                <button type="button" onclick="inserisci('À')">À</button>
                <button type="button" onclick="inserisci('È')">È</button>
                <button type="button" onclick="inserisci('É')">É</button>
                <button type="button" onclick="inserisci('Ì')">Ì</button>
                <button type="button" onclick="inserisci('Ò')">Ò</button>
                <button type="button" onclick="inserisci('Ù')">Ù</button>
                <div class="sep"></div>
                <button type="button" onclick="inserisci('ä')">ä</button>
                <button type="button" onclick="inserisci('ö')">ö</button>
                <button type="button" onclick="inserisci('ü')">ü</button>
                <button type="button" onclick="inserisci('Ä')">Ä</button>
                <button type="button" onclick="inserisci('Ö')">Ö</button>
                <button type="button" onclick="inserisci('Ü')">Ü</button>
                <button type="button" onclick="inserisci('ß')">ß</button>
                <div class="sep"></div>
                <button type="button" onclick="inserisci('«')">«</button>
                <button type="button" onclick="inserisci('»')">»</button>
                <button type="button" onclick="inserisci('…')">…</button>
                <button type="button" onclick="inserisci('—')">—</button>
            </div>

            <div id="content"
                 contenteditable="true"
                 class="text-input"
                 style="min-height: 200px; border: 1px solid #ccc; background: white; cursor: text;"
                 placeholder="Scrivi il tuo articolo qui...">
            </div>
        </div>

        <button id="submit-btn">Pubblica Post</button>
        <button id="logout-btn" style="background: #ff4747; margin-top: 20px;">Sconnettiti</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const editor = document.getElementById('content');

        function formato(cmd) {
            document.execCommand(cmd, false, null);
            editor.focus();
        }

        function inserisci(char) {
            editor.focus();
            document.execCommand('insertText', false, char);
        }
    </script>

    <script src="js/admin.js"></script>
</body>
</html>
